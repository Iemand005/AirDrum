[platformio]
description = Receiver for AirDrum
default_envs = nano

[env]
monitor_speed = 115200
framework = arduino
lib_deps =
    sui77/rc-switch@^2.6.4
    ; c:\Users\Lasse\Documents\Projects\Workshop-Material-2025-2026\05-oled-sh1106-i2c\platformio.ini
    adafruit/Adafruit GFX Library@^1.11.9
	https://github.com/nhatuan84/esp32-sh1106-oled

[env:esp32dev]
platform = espressif32
board = esp32dev
upload_speed = 921600 # uncomment if you have issues with uploading

[env:nano]
platform = atmelavr
board = nanoatmega328new