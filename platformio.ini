[platformio]
description = AirDrum sender
default_envs = esp32dev

[env]
monitor_speed = 115200
framework = arduino
lib_deps =
    Wire
    sui77/rc-switch@^2.6.4
    ESP32Async/ESPAsyncWebServer
build_flags = 
    -I ../lib

[env:esp32devServer]
platform = espressif32
board = esp32dev
upload_speed = 921600 # uncomment if you have issues with uploading
src_dir = server/src

[env:nanoServer]
platform = atmelavr
board = nanoatmega328new
src_dir = server/src

[env:esp32devClient]
platform = espressif32
board = esp32dev
upload_speed = 921600 # uncomment if you have issues with uploading
src_dir = client/src

[env:nanoClient]
platform = atmelavr
board = nanoatmega328new
src_dir = client/src
